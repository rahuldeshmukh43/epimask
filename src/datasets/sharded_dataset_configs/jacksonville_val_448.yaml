# Config for src/datasets/make_sharded_webdataset.py
# Jacksonville balanced val pairs -> 2000-sample sharded webdataset, hw448.
# Paths are relative to the repo root (scripts/epimask/make_sharded_webdataset.sh cd's there).

phase: val
val_pairlist: data/satdepth/index/jax_balanced_val_pairs.csv

img_patch_size: 448
train_img_size: 448

kp_mode: mixed # [sift, random, mixed]
pct_sift: 0.5
num_pts: 800 # initial number of pts to be drawn
num_pts_retained: 128 # final matching pts
funda_method: cameras
rot_aug: true

# Jacksonville sharded dataset val 2000 (8 shards, 250 each)
shard_dir: data/satdepth/webdataset/satdepth-hw448-128k-rot_aug
sharded_dataset_total_num_samples: 2000
max_records_per_shard: 250
