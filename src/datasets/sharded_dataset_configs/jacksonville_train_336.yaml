# Config for src/datasets/make_sharded_webdataset.py
# Jacksonville balanced train pairs -> 128k-sample sharded webdataset, hw336.
# Paths are relative to the repo root (scripts/epimask/make_sharded_webdataset.sh cd's there).

phase: train
train_pairlist: data/satdepth/index/jax_balanced_train_pairs.csv

img_patch_size: 336
train_img_size: 336

kp_mode: mixed # [sift, random, mixed]
pct_sift: 0.5
num_pts: 800 # initial number of pts to be drawn
num_pts_retained: 128 # final matching pts
funda_method: cameras
rot_aug: true

# Jacksonville sharded dataset train 128k (256 shards, 500 each)
shard_dir: data/satdepth/webdataset/satdepth-hw336-128k-rot_aug

sharded_dataset_total_num_samples: 128000
max_records_per_shard: 500
